name: Sync to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          
          # Prepare Space README with required HF Docker metadata frontmatter
          cp backend/HF_SPACE_README.md backend/README.md
          git add backend/README.md
          git commit -m "Setup HF Space README" || true
          
          # Extract backend directory to root for Hugging Face Space deployment
          git subtree split --prefix backend -b hf-release
          
          # Push to Hugging Face Space
          git remote add space https://SamD444:${HF_TOKEN}@huggingface.co/spaces/SamD444/SkillDelta
          git push space hf-release:main --force
